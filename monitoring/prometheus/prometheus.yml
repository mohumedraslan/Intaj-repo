global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'intaj-production'
    environment: 'production'

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor for container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Intaj Application
  - job_name: 'intaj-app'
    metrics_path: '/api/v1/metrics'
    scrape_interval: 30s
    static_configs:
      - targets: ['host.docker.internal:3000']
    scrape_timeout: 10s

  # Supabase Edge Functions
  - job_name: 'supabase-functions'
    metrics_path: '/metrics'
    scrape_interval: 30s
    static_configs:
      - targets: ['supabase-functions:8000']
    basic_auth:
      username: 'prometheus'
      password: '${SUPABASE_METRICS_PASSWORD}'

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # Custom business metrics
  - job_name: 'intaj-business-metrics'
    metrics_path: '/api/v1/metrics/business'
    scrape_interval: 60s
    static_configs:
      - targets: ['host.docker.internal:3000']

  # Health check monitoring
  - job_name: 'intaj-health'
    metrics_path: '/api/v1/health'
    scrape_interval: 30s
    static_configs:
      - targets: ['host.docker.internal:3000']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'up'
        target_label: 'service'
        replacement: 'intaj-app'

  # External service monitoring
  - job_name: 'external-apis'
    metrics_path: '/api/v1/metrics/external'
    scrape_interval: 60s
    static_configs:
      - targets: ['host.docker.internal:3000']

groups:
  - name: intaj.critical
    rules:
      # Application availability
      - alert: IntajAppDown
        expr: up{job="intaj-app"} == 0
        for: 1m
        labels:
          severity: critical
          service: intaj-app
        annotations:
          summary: "Intaj application is down"
          description: "Intaj application has been down for more than 1 minute"
          runbook_url: "https://docs.intaj.ai/runbooks/app-down"

      # Database connectivity
      - alert: DatabaseConnectionFailure
        expr: intaj_database_connections_failed_total > 0
        for: 30s
        labels:
          severity: critical
          service: database
        annotations:
          summary: "Database connection failures detected"
          description: "{{ $value }} database connection failures in the last 30 seconds"

      # High error rate
      - alert: HighErrorRate
        expr: rate(intaj_http_requests_total{status=~"5.."}[5m]) / rate(intaj_http_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          service: intaj-app
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for the last 5 minutes"

      # LLM processing failures
      - alert: LLMProcessingFailures
        expr: rate(intaj_llm_requests_failed_total[5m]) > 0.5
        for: 2m
        labels:
          severity: critical
          service: llm
        annotations:
          summary: "High LLM processing failure rate"
          description: "LLM processing failure rate is {{ $value }} requests/second"

  - name: intaj.warning
    rules:
      # High response time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(intaj_http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          service: intaj-app
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}s"

      # Memory usage
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.8
        for: 10m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }}"

      # CPU usage
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}%"

      # Disk usage
      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes > 0.8
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High disk usage"
          description: "Disk usage is {{ $value | humanizePercentage }} on {{ $labels.mountpoint }}"

      # Agent creation rate drop
      - alert: AgentCreationRateDrop
        expr: rate(intaj_agents_created_total[1h]) < rate(intaj_agents_created_total[24h] offset 24h) * 0.5
        for: 30m
        labels:
          severity: warning
          service: business
        annotations:
          summary: "Agent creation rate has dropped significantly"
          description: "Current agent creation rate is 50% lower than yesterday"

  - name: intaj.business
    rules:
      # Message processing rate
      - alert: LowMessageProcessingRate
        expr: rate(intaj_messages_processed_total[1h]) < 10
        for: 30m
        labels:
          severity: warning
          service: business
        annotations:
          summary: "Low message processing rate"
          description: "Message processing rate is {{ $value }} messages/hour"

      # Webhook failures
      - alert: WebhookFailures
        expr: rate(intaj_webhook_requests_failed_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: integrations
        annotations:
          summary: "Webhook failures detected"
          description: "Webhook failure rate is {{ $value }} failures/second"

      # User activity drop
      - alert: UserActivityDrop
        expr: rate(intaj_user_sessions_total[1h]) < rate(intaj_user_sessions_total[24h] offset 24h) * 0.3
        for: 1h
        labels:
          severity: info
          service: business
        annotations:
          summary: "User activity has dropped"
          description: "User activity is 70% lower than yesterday"

  - name: intaj.infrastructure
    rules:
      # Container restarts
      - alert: ContainerRestarts
        expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "Container is restarting frequently"
          description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is restarting"

      # Redis connectivity
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis is down"
          description: "Redis instance is not responding"

      # SSL certificate expiry
      - alert: SSLCertificateExpiry
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 7
        for: 1h
        labels:
          severity: warning
          service: security
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate expires in {{ $value | humanizeDuration }}"

  - name: intaj.external
    rules:
      # OpenRouter API issues
      - alert: OpenRouterAPIIssues
        expr: rate(intaj_external_api_requests_failed_total{service="openrouter"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: external-api
        annotations:
          summary: "OpenRouter API issues detected"
          description: "OpenRouter API failure rate is {{ $value }} failures/second"

      # Telegram API issues
      - alert: TelegramAPIIssues
        expr: rate(intaj_external_api_requests_failed_total{service="telegram"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: external-api
        annotations:
          summary: "Telegram API issues detected"
          description: "Telegram API failure rate is {{ $value }} failures/second"

      # Supabase connectivity
      - alert: SupabaseConnectivityIssues
        expr: rate(intaj_external_api_requests_failed_total{service="supabase"}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          service: external-api
        annotations:
          summary: "Supabase connectivity issues"
          description: "Supabase API failure rate is {{ $value }} failures/second"
